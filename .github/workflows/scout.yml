name: Optional GREEN Role Scout

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1,3,5'

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run scout hook
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python scripts/scout.py
      - name: Commit scout report if changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "career-tracker-bot"
          git config user.email "career-tracker-bot@users.noreply.github.com"
          git add reports
          git commit -m "chore: scheduled green-role scout report"
          git push
